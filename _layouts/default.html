<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The landing page's title IS the site title, so prepending it gives
       "Sayanan Sivaraman · Sayanan Sivaraman". Only prefix when they differ. -->
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Open Graph: a portfolio link gets pasted into Slack and LinkedIn, and a bare URL with no
       card reads as unfinished. -->
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  {% if page.og_image %}
  <meta property="og:image" content="{{ page.og_image | relative_url | absolute_url }}">
  <meta name="twitter:card" content="{{ page.og_card | default: 'summary_large_image' }}">
  {% endif %}

  <!-- SVG first: sharp at any density, and modern browsers prefer it. The .ico is the fallback
       (and is fetched from the root by browsers that ignore these tags entirely); the PNG is the
       iOS home-screen icon, which must be opaque because iOS composites alpha on black. -->
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="alternate icon" href="{{ '/favicon.ico' | relative_url }}" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site">
    <a class="home" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <!-- The fragment is appended AFTER relative_url rather than passed through it, so the filter
           only ever sees a path. On the landing page this scrolls to the list; from a project page
           it navigates home and lands on the list rather than the intro. -->
      <a href="{{ '/' | relative_url }}#projects">Projects</a>
      <a href="{{ '/' | relative_url }}#about">About</a>
      <a href="{{ '/' | relative_url }}#elsewhere">Elsewhere</a>
      <a href="https://github.com/sayanansivaraman-dev">GitHub</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site">
    <p>
      Built with Jekyll on GitHub Pages.
    </p>
  </footer>
</body>
</html>
